[package]
name = "orbit-vault"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Orbit vault: shared USDC spending vault for AI agent fleets on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Mainnet build: pins Circle USDC and caps float_cap at 20 USDC.
mainnet = []
# Test-only build (sandbox T-35): `migrate` panics, so an upgrade to it must revert the deploy.
test-migrate-panic = []

[dependencies]
near-sdk = "5.27"
hex = "0.4"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.27", features = ["unit-testing"] }
