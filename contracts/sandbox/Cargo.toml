[package]
name = "orbit-sandbox-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]

[dev-dependencies]
near-workspaces = { version = "0.22", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
# Same versions near-workspaces already pulls in (no extra build): raw signed tx for the replay test.
near-jsonrpc-client = "=0.20.0"
near-primitives = "=0.34.7"
near-crypto = "=0.34.7"
